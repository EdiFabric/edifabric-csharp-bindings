name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Push to nuget.org (otherwise pack and smoke-test only)
        type: boolean
        default: false

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check the release tag matches the version
        if: github.event_name == 'release'
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' EdiFabric.Native.X12/EdiFabric.Native.X12.csproj | head -n 1)
          test "${GITHUB_REF_NAME#v}" = "$version" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: bash scripts/fetch-natives.sh natives
      - run: dotnet pack EdiFabric.Native.X12 -c Release -o dist -p:ContinuousIntegrationBuild=true
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*
          if-no-files-found: error

  smoke-test:
    needs: pack
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - name: Load the bundled library through a PackageReference
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' EdiFabric.Native.X12/EdiFabric.Native.X12.csproj | head -n 1)
          smoke="$RUNNER_TEMP/smoke"
          mkdir "$smoke"
          cp scripts/smoke-test/SmokeTest.csproj scripts/smoke-test/Program.cs "$smoke"
          cd "$smoke"
          dotnet restore --source "$GITHUB_WORKSPACE/dist" --packages "$smoke/packages" -p:EdiFabricVersion="$version"
          dotnet run --no-restore -c Release -p:EdiFabricVersion="$version"

  publish:
    needs: smoke-test
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      # Trusted publishing: exchanges the job's OIDC token for a short-lived nuget.org API key.
      - uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      # Pushes the .snupkg symbols beside it too; --skip-duplicate lets a failed release be rerun.
      - run: dotnet nuget push "dist/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
